<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="site-header__brand" aria-label="Dez">Dez</div>
      <h1 class="site-header__title">Currency Converter</h1>
      <div class="site-header__meta" aria-label="Current date and time" data-i18n-aria-label="clockLabel">
        <time class="site-header__time-pill" id="current-date"></time>
        <time class="site-header__time-pill" id="current-time"></time>
        <div class="theme-switch" role="group" aria-label="Color theme" data-i18n-aria-label="themeLabel">
          <span class="theme-switch__indicator" aria-hidden="true"></span>
          <button type="button" class="theme-switch__button" id="theme-light" aria-pressed="true" data-i18n="light">Light</button>
          <button type="button" class="theme-switch__button" id="theme-dark" aria-pressed="false" data-i18n="dark">Dark</button>
        </div>
        <label class="visually-hidden" for="language-select" data-i18n="language">Language</label>
        <select id="language-select" class="language-select" aria-label="Language" data-i18n-aria-label="language">
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </div>
    </header>

    <main class="page">
      <div class="converter">
        <div class="converter__intro">
          <h2 class="converter__title" data-i18n="ratesTitle">Today's Rates</h2>
          <p class="converter__subtitle" data-i18n="converterSubtitle">Convert currencies instantly</p>
        </div>

        <div class="converter__panels">
          <div class="converter__panel converter__panel--from">
            <label class="converter__label" for="from-currency" data-i18n="from">From:</label>

            <div class="converter__field">
              <span class="converter__currency-symbol" id="from-symbol" aria-hidden="true"></span>
              <label class="visually-hidden" for="amount" data-i18n="amountLabel">Amount to convert</label>
              <input
                type="number"
                name="amount"
                id="amount"
                placeholder="Enter amount"
                data-i18n-placeholder="amountPlaceholder"
                class="converter__input"
                min="0"
                step="any"
              />

              <select
                name="from-currency"
                id="from-currency"
                class="converter__select"
                aria-label="From currency"
              >
              </select>
            </div>
          </div>

          <div class="converter__panel converter__panel--to">
            <label class="converter__label" for="to-currency" data-i18n="to">To:</label>

            <div class="converter__field">
              <span class="converter__currency-symbol" id="to-symbol" aria-hidden="true"></span>
              <label class="visually-hidden" for="result" data-i18n="resultLabel">Converted amount</label>
              <input
                type="text"
                id="result"
                placeholder="Converted amount"
                data-i18n-placeholder="resultPlaceholder"
                class="converter__input"
                readonly
              />

              <select
                name="to-currency"
                id="to-currency"
                class="converter__select"
                aria-label="To currency"
              >
              </select>
            </div>
          </div>

          <div class="converter__swap">
            <button type="button" class="converter__swap-btn" aria-label="Swap currencies" data-i18n-aria-label="swap">&#8645;</button>
          </div>
        </div>

        <div class="converter__rate-row">
          <p id="rate-info" class="converter__message converter__message--rate" aria-live="polite"></p>
          <div class="converter__rate-actions">
            <span id="last-updated" class="converter__updated" aria-live="polite"></span>
            <button type="button" id="refresh-rates" class="converter__refresh" data-i18n="refresh">Refresh rates</button>
          </div>
        </div>
        <p id="error-message" class="converter__message converter__message--error" role="alert"></p>

        <section class="converter__alert" aria-labelledby="alert-title">
          <h2 id="alert-title" class="converter__alert-title" data-i18n="alertTitle">Email me a rate alert</h2>
          <p class="converter__subtitle" data-i18n="alertIntro">
            Get one email when a rate crosses your target or moves by a chosen percentage.
          </p>
          <form id="alert-form" class="converter__alert-form">
            <label class="converter__alert-field" for="alert-email">
              <span data-i18n="email">Email address</span>
              <input
                type="email"
                id="alert-email"
                name="email"
                autocomplete="email"
                maxlength="254"
                required
              />
            </label>

            <label class="converter__alert-field" for="alert-type">
              <span data-i18n="alertType">Alert type</span>
              <select id="alert-type" name="alert-type">
                <option value="target" data-i18n="targetType">Target exchange rate</option>
                <option value="percent" data-i18n="percentType">Percentage move</option>
              </select>
            </label>

            <label class="converter__alert-field" for="alert-direction" data-i18n="alertCondition">Alert condition</label>
            <select id="alert-direction" name="alert-direction"></select>

            <label class="converter__alert-field" id="alert-threshold-label" for="alert-threshold">
              <span id="alert-threshold-description" data-i18n="targetRate">Target rate (in the selected To currency)</span>
              <input
                type="number"
                id="alert-threshold"
                name="threshold"
                min="0.000000000001"
                step="any"
                required
              />
            </label>

            <label class="converter__alert-consent">
              <input type="checkbox" id="alert-consent" required />
              <span data-i18n="consent">Email me one alert for this condition. I understand I need to confirm my email.</span>
            </label>

            <button type="submit" class="converter__refresh" data-i18n="createAlert">Create email alert</button>
            <p id="alert-status" class="converter__alert-status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
