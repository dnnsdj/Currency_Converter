<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
    <meta name="theme-color" content="#0b7a5a" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="site-header__brand" aria-label="Dez">
        <img src="assets/brand/logo-mark.svg" alt="" width="44" height="44" />
      </div>
      <h1 class="site-header__title">Currency Converter</h1>
      <button
        type="button"
        class="site-header__menu-toggle"
        id="header-menu-toggle"
        aria-controls="header-tools"
        aria-expanded="false"
        aria-label="Open settings"
        data-i18n-aria-label="openSettings"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <div class="site-header__meta">
        <div class="site-header__clock" aria-label="Current date and time" data-i18n-aria-label="clockLabel">
          <time class="site-header__time-pill" id="current-date"></time>
          <time class="site-header__time-pill" id="current-time"></time>
        </div>
        <div class="site-header__tools" id="header-tools">
          <div class="theme-switch" role="group" aria-label="Color theme" data-i18n-aria-label="themeLabel">
            <span class="theme-switch__indicator" aria-hidden="true"></span>
            <button type="button" class="theme-switch__button" id="theme-light" aria-pressed="true" data-i18n-aria-label="light">
              <i class="fa-solid fa-sun" aria-hidden="true"></i>
            </button>
            <button type="button" class="theme-switch__button" id="theme-dark" aria-pressed="false" data-i18n-aria-label="dark">
              <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>
          </div>
          <label class="visually-hidden" for="language-select" data-i18n="language">Language</label>
          <select id="language-select" class="language-select" aria-label="Language" data-i18n-aria-label="language">
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="converter">
        <div class="converter__intro">
          <div class="converter__intro-copy">
            <span class="converter__badge" data-i18n="eyebrow">Live rates · Fiat &amp; crypto</span>
            <h2 class="converter__title" data-i18n="ratesTitle">Make every cedi count</h2>
            <p class="converter__subtitle" data-i18n="converterSubtitle">Fast, clear conversions between the cedi, major currencies and crypto.</p>
          </div>
          <button
            type="button"
            id="refresh-rates"
            class="converter__refresh"
            aria-label="Refresh rates"
            data-i18n-aria-label="refresh"
          >
            <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
          </button>
        </div>

        <div class="converter__panels">
          <div class="converter__panel converter__panel--from">
            <label class="converter__label" for="from-currency" data-i18n="from">Base currency</label>

            <div class="converter__field">
              <span class="converter__currency-symbol" id="from-symbol" aria-hidden="true"></span>
              <label class="visually-hidden" for="amount" data-i18n="amountLabel">Amount in base currency</label>
              <input
                type="text"
                name="amount"
                id="amount"
                placeholder="0.00"
                data-i18n-placeholder="amountPlaceholder"
                class="converter__input"
                inputmode="decimal"
                autocomplete="off"
              />

              <select
                name="from-currency"
                id="from-currency"
                class="converter__select"
                aria-label="Base currency"
                data-i18n-aria-label="fromCurrency"
              >
              </select>
            </div>
            <div class="quick-amounts" role="group" aria-label="Quick amounts" data-i18n-aria-label="quickAmounts">
              <button type="button" class="chip" data-amount="10">10</button>
              <button type="button" class="chip" data-amount="100">100</button>
              <button type="button" class="chip" data-amount="500">500</button>
              <button type="button" class="chip" data-amount="1000">1,000</button>
            </div>
            <p id="rate-info-from" class="converter__panel-rate" aria-live="polite"></p>
          </div>

          <div class="converter__panel converter__panel--to">
            <label class="converter__label" for="to-currency" data-i18n="to">Quote currency</label>

            <div class="converter__field">
              <span class="converter__currency-symbol" id="to-symbol" aria-hidden="true"></span>
              <label class="visually-hidden" for="result" data-i18n="resultLabel">Converted amount in quote currency</label>
              <input
                type="text"
                id="result"
                placeholder="0.00"
                data-i18n-placeholder="resultPlaceholder"
                class="converter__input"
                inputmode="decimal"
                autocomplete="off"
              />

              <select
                name="to-currency"
                id="to-currency"
                class="converter__select"
                aria-label="Quote currency"
                data-i18n-aria-label="toCurrency"
              >
              </select>
            </div>
            <div class="quick-amounts" role="group" aria-label="Quick amounts" data-i18n-aria-label="quickAmounts">
              <button type="button" class="chip" data-amount="10" data-side="to">10</button>
              <button type="button" class="chip" data-amount="100" data-side="to">100</button>
              <button type="button" class="chip" data-amount="500" data-side="to">500</button>
              <button type="button" class="chip" data-amount="1000" data-side="to">1,000</button>
            </div>
            <p id="rate-info-to" class="converter__panel-rate" aria-live="polite"></p>
          </div>

          <div class="converter__swap">
            <button type="button" class="converter__swap-btn" aria-label="Swap base and quote currencies" data-i18n-aria-label="swap">&#8645;</button>
          </div>
        </div>

        <div class="converter__rate-row" data-state="idle">
          <span class="converter__status">
            <span class="converter__dot" aria-hidden="true"></span>
            <span id="last-updated" class="converter__updated" aria-live="polite"></span>
          </span>
          <button type="button" id="copy-result" class="text-button" disabled>
            <i class="fa-solid fa-copy" aria-hidden="true"></i>
            <span id="copy-label" data-i18n="copy">Copy result</span>
          </button>
        </div>
        <div class="rate-backup" role="group" aria-label="Rate backup" data-i18n-aria-label="rateBackup">
          <button type="button" id="export-rates" class="text-button" data-i18n="exportRates">Export rates</button>
          <button type="button" id="import-rates" class="text-button" data-i18n="importRates">Import rates</button>
          <input type="file" id="import-rates-file" accept="application/json,.json" hidden />
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <p data-i18n="footerNote">Indicative rates for information only. Sources: ExchangeRate-API and CoinGecko.</p>
      <p class="site-footer__watermark">
        <span>Made with love from Ghana</span>
        <svg class="site-footer__flag" viewBox="0 0 30 20" role="img" aria-label="Ghana flag">
          <rect width="30" height="20" fill="#006b3f" />
          <rect width="30" height="13.34" fill="#fcd116" />
          <rect width="30" height="6.67" fill="#ce1126" />
          <path fill="#000" d="m15 6.6 1.1 2.25 2.48.36-1.79 1.75.42 2.47L15 12.27l-2.22 1.16.42-2.47-1.79-1.75 2.48-.36z" />
        </svg>
      </p>
    </footer>
    <aside id="error-notification" class="error-notification" role="alert" aria-live="assertive" hidden>
      <div class="error-notification__header">
        <h2 class="error-notification__title" data-i18n="alertTitle">Alert</h2>
        <button type="button" id="dismiss-error" class="error-notification__close" aria-label="Dismiss" data-i18n-aria-label="dismiss">×</button>
      </div>
      <hr class="error-notification__divider" />
      <p id="error-message" class="error-notification__message"></p>
    </aside>
    <script src="js/script.js"></script>
  </body>
</html>
